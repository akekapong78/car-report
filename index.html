<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2c82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตรวจรถ ผมต.นธ.">
<meta name="mobile-web-app-capable" content="yes">
<title>บันทึกตรวจรถ ผมต.นธ.</title>
<style>
  :root {
    --accent: #5b2c82;
    --accent-dark: #45215f;
    --bg: #f2eef7;
    --card-bg: #ffffff;
    --text: #201a29;
    --text-dim: #6b6475;
    --border: #e1d9ec;
    --input-bg: #faf8fc;
    --success: #1e8e5a;
    --error: #c0392b;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #b083e0;
      --accent-dark: #8a5cc4;
      --bg: #16121c;
      --card-bg: #211b2b;
      --text: #f1ecf7;
      --text-dim: #a89fb8;
      --border: #3a3247;
      --input-bg: #2a2335;
      --success: #4fd394;
      --error: #ff7a68;
    }
  }
  :root[data-theme="dark"] {
    --accent: #b083e0; --accent-dark: #8a5cc4; --bg: #16121c; --card-bg: #211b2b;
    --text: #f1ecf7; --text-dim: #a89fb8; --border: #3a3247; --input-bg: #2a2335;
    --success: #4fd394; --error: #ff7a68;
  }
  :root[data-theme="light"] {
    --accent: #5b2c82; --accent-dark: #45215f; --bg: #f2eef7; --card-bg: #ffffff;
    --text: #201a29; --text-dim: #6b6475; --border: #e1d9ec; --input-bg: #faf8fc;
    --success: #1e8e5a; --error: #c0392b;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai UI", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 440px; }

  header { text-align: center; margin: 8px 0 20px; }
  header .badge {
    display: inline-block; font-size: 13px; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    padding: 4px 12px; border-radius: 999px; font-weight: 600; margin-bottom: 10px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header p { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }

  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block; font-size: 14px; font-weight: 600;
    margin-bottom: 8px; color: var(--text);
  }
  label .hint { font-weight: 400; color: var(--text-dim); font-size: 12.5px; }

  select, input[type="number"], input[type="text"] {
    width: 100%;
    font-size: 17px;
    padding: 14px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20'><path d='M5 8l5 5 5-5' stroke='%236b6475' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }

  .compute-preview {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }
  .compute-preview strong { color: var(--accent); }

  /* ---- checklist dropdown (ความผิดปกติ) ---- */
  .checklist-dropdown {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--input-bg);
  }
  .checklist-dropdown summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 40px 14px 14px;
    font-size: 15px;
    color: var(--text);
    position: relative;
    line-height: 1.4;
  }
  .checklist-dropdown summary::-webkit-details-marker { display: none; }
  .checklist-dropdown summary::after {
    content: "";
    position: absolute;
    right: 16px; top: 50%;
    width: 10px; height: 10px;
    margin-top: -6px;
    border-right: 1.8px solid var(--text-dim);
    border-bottom: 1.8px solid var(--text-dim);
    transform: rotate(45deg);
    transition: transform .15s ease;
  }
  .checklist-dropdown[open] summary::after { transform: rotate(-135deg); margin-top: -2px; }
  .checklist-dropdown[open] summary { border-bottom: 1.5px solid var(--border); }
  .checklist-panel {
    max-height: 280px;
    overflow-y: auto;
    padding: 6px 4px;
  }
  .check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    color: var(--text);
    cursor: pointer;
    border-radius: 8px;
  }
  .check-item:active { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .check-item input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .check-item.no-issue { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 12px; font-weight: 600; }

  textarea {
    width: 100%;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
    margin-top: 10px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .submit-btn {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .submit-btn:active { transform: scale(0.98); background: var(--accent-dark); }
  .submit-btn:disabled { opacity: 0.5; }

  .error-msg {
    color: var(--error);
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    min-height: 16px;
  }

  /* ---- state views ---- */
  #view-form, #view-loading { display: none; }
  body[data-state="form"] #view-form { display: block; }
  body[data-state="loading"] #view-loading { display: flex; }

  #view-loading {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 60px 10px;
  }

  .spinner {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #view-loading p { color: var(--text-dim); font-size: 14px; }

  footer { text-align: center; margin-top: 18px; font-size: 11.5px; color: var(--text-dim); }
</style>
</head>
<body data-state="form">
<div class="app">

  <header>
    <span class="badge">ผมต.กฟส.นธ. · กฟส.นราธิวาส</span>
    <h1>บันทึกตรวจรถก่อนปฏิบัติงาน</h1>
    <p>กรอกแค่ 3 ช่อง ระบบจะเปิด Google Form พร้อมกรอกให้ครบ แค่กด "ถัดไป" ไล่ไปจนถึงหน้าสุดท้ายแล้วกด "Submit"</p>
  </header>

  <div class="card">

    <!-- FORM VIEW -->
    <form id="view-form" novalidate>
      <div class="field">
        <label for="plate">ทะเบียนรถ</label>
        <select id="plate" required>
          <option value="" disabled selected>เลือกทะเบียนรถ</option>
          <option value="บฉ 7079 นธ.">บฉ 7079 นธ.</option>
          <option value="2 ขศ 9017 กทม.">2 ขศ 9017 กทม.</option>
          <option value="80-5930 นธ.">80-5930 นธ.</option>
        </select>
      </div>

      <div class="field">
        <label for="mileage">เลขไมล์ <span class="hint">(กม.)</span></label>
        <input type="number" id="mileage" inputmode="numeric" pattern="[0-9]*" min="0" step="1" placeholder="เช่น 123456" required>
        <div class="compute-preview" id="oilPreview"></div>
      </div>

      <div class="field">
        <label for="empCode">รหัสพนักงาน</label>
        <input type="text" id="empCode" inputmode="numeric" pattern="[0-9]*" placeholder="กรอกรหัสพนักงาน" required>
      </div>

      <div class="field">
        <label for="checklistTrigger">ความผิดปกติ</label>
        <details class="checklist-dropdown" id="checklistDropdown">
          <summary id="checklistTrigger">ไม่พบปัญหา</summary>
          <div class="checklist-panel" id="checklistPanel">
            <label class="check-item"><input type="checkbox" value="เข็มขัดนิรภัย">เข็มขัดนิรภัย</label>
            <label class="check-item"><input type="checkbox" value="ไฟส่องสว่าง (สูง-ต่ำ) หน้า-หลัง">ไฟส่องสว่าง (สูง-ต่ำ) หน้า-หลัง</label>
            <label class="check-item"><input type="checkbox" value="ไฟเบรก">ไฟเบรก</label>
            <label class="check-item"><input type="checkbox" value="ไฟสัญญาณ (ไฟวับวาบ,เลี้ยวซ้าย-ขวา,ถอย)">ไฟสัญญาณ (ไฟวับวาบ,เลี้ยวซ้าย-ขวา,ถอย)</label>
            <label class="check-item"><input type="checkbox" value="กระจกหน้ารถ">กระจกหน้ารถ</label>
            <label class="check-item"><input type="checkbox" value="กระจกมองข้าง/หลัง">กระจกมองข้าง/หลัง</label>
            <label class="check-item"><input type="checkbox" value="ที่ปัดน้ำฝน">ที่ปัดน้ำฝน</label>
            <label class="check-item"><input type="checkbox" value="น้ำฉีดกระจก">น้ำฉีดกระจก</label>
            <label class="check-item"><input type="checkbox" value="ระดับน้ำมันเชื้อเพลิง">ระดับน้ำมันเชื้อเพลิง</label>
            <label class="check-item"><input type="checkbox" value="ระดับน้ำมันหล่อลื่นเครื่องยนต์">ระดับน้ำมันหล่อลื่นเครื่องยนต์</label>
            <label class="check-item"><input type="checkbox" value="การทำงานของแตร">การทำงานของแตร</label>
            <label class="check-item"><input type="checkbox" value="ระบบเบรก (เบรกมือ/เบรกเท้า)">ระบบเบรก (เบรกมือ/เบรกเท้า)</label>
            <label class="check-item"><input type="checkbox" value="เครื่องปรับอากาศ">เครื่องปรับอากาศ</label>
            <label class="check-item"><input type="checkbox" value="สภาพยาง กระทะล้อ และน๊อตยึดล้อ">สภาพยาง กระทะล้อ และน๊อตยึดล้อ</label>
            <label class="check-item"><input type="checkbox" value="อุปกรณ์ดับเพลิง">อุปกรณ์ดับเพลิง</label>
            <label class="check-item"><input type="checkbox" value="แบตเตอรี่ (ขั้ว, น้ำกลั่น)">แบตเตอรี่ (ขั้ว, น้ำกลั่น)</label>
            <label class="check-item"><input type="checkbox" value="ทำความสะอาดด้านในและด้านนอก">ทำความสะอาดด้านในและด้านนอก</label>
            <label class="check-item"><input type="checkbox" value="ความเสียหายภายใน">ความเสียหายภายใน</label>
            <label class="check-item"><input type="checkbox" value="ความเสียหายภายนอก">ความเสียหายภายนอก</label>
            <label class="check-item no-issue"><input type="checkbox" value="ไม่พบปัญหา" checked>ไม่พบปัญหา</label>
          </div>
        </details>
        <textarea id="checklistDetail" placeholder="รายละเอียดข้อบกพร่อง (หากไม่พบปัญหา ระบุว่า &quot;ปกติ&quot;)">ปกติ</textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">เปิดฟอร์มพร้อมข้อมูล</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <!-- LOADING VIEW (brief, shown while navigating to Google Forms) -->
    <div id="view-loading">
      <div class="spinner"></div>
      <p>กำลังเปิด Google Form...</p>
    </div>

  </div>

  <footer>ระบบภายใน · ผมต.กฟส.นธ.</footer>
</div>

<script>
(function () {
  "use strict";

  // Google Forms rejects raw POSTs to /formResponse for multi-page forms like this one
  // (it needs a fresh, per-load "fbzx" token that a cross-origin fetch() can never read —
  // docs.google.com sends no CORS headers). Instead we redirect to the form's own
  // "pre-filled link" URL: Google's real page then loads with every field already filled
  // in on its page, so submitting is just tapping "Next" a few times, no retyping.
  var FORM_VIEW_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfaPj31ahG0RD69C6phnXxZvTygc36dVDeyLbGbCgRBZgiHMA/viewform";
  var CACHE_KEY = "vehicleCheckinCache_v1";

  // entry.<id> mapping reverse-engineered from the live Google Form's FB_PUBLIC_LOAD_DATA_
  var ENTRY = {
    BRANCH: "1645257452",           // กฟฟ.
    DEPT: "225784074",              // แผนกใน กฟจ.นธ. และ กฟฟ.ในสังกัด
    PLATE: "506576836",             // หมายเลขทะเบียนรถ ผมต.นธ.
    LAST_OIL: "266239586",          // เลขไมล์เปลี่ยนถ่ายน้ำมันเครื่องครั้งต่อไป (คำนวณ)
    MILEAGE: "2028474554",          // เลขไมล์ปัจจุบัน
    VEHICLE_TYPE: "192645283",      // ประเภทรถ
    CHECKLIST: "1190046626",        // รายการปัญหาที่พบ (รถทั่วไป)
    CHECKLIST_DETAIL: "776683018",  // รายละเอียดข้อบกพร่อง (รถทั่วไป)
    EMP_CODE: "38458013"            // รหัสพนักงาน
  };

  var FIXED = {
    branch: "กฟส.นราธิวาส",
    dept: "ผมต.กฟส.นธ.",
    vehicleType: "รถทั่วไป นอกเหนือข้อ 1-2"
  };
  var NO_ISSUE = "ไม่พบปัญหา";

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  var plateEl = $("plate"), mileageEl = $("mileage"), empCodeEl = $("empCode");
  var oilPreview = $("oilPreview"), errorMsg = $("errorMsg");
  var checklistPanel = $("checklistPanel"), checklistTrigger = $("checklistTrigger"), checklistDetailEl = $("checklistDetail");
  var checklistBoxes = Array.prototype.slice.call(checklistPanel.querySelectorAll("input[type=checkbox]"));
  var noIssueBox = checklistBoxes.filter(function (b) { return b.value === NO_ISSUE; })[0];

  function setState(s) { body.setAttribute("data-state", s); }

  function computeLastOil(mileage) {
    return Math.floor(mileage / 10000) * 10000;
  }

  function fmt(n) { return Number(n).toLocaleString("th-TH"); }

  function updatePreview() {
    var v = parseInt(mileageEl.value, 10);
    if (!isNaN(v) && v >= 0) {
      oilPreview.innerHTML = "ระยะเปลี่ยนถ่ายน้ำมันเครื่องล่าสุด: <strong>" + fmt(computeLastOil(v)) + " กม.</strong>";
    } else {
      oilPreview.textContent = "";
    }
  }
  mileageEl.addEventListener("input", updatePreview);

  // ---- ความผิดปกติ: checkbox dropdown, "ไม่พบปัญหา" is mutually exclusive with the rest ----
  function selectedProblems() {
    return checklistBoxes.filter(function (b) { return b.checked && b !== noIssueBox; }).map(function (b) { return b.value; });
  }
  function updateChecklistSummary() {
    var problems = selectedProblems();
    if (problems.length === 0) {
      checklistTrigger.textContent = NO_ISSUE;
      if (checklistDetailEl.value.trim() === "" ) checklistDetailEl.value = "ปกติ";
    } else {
      checklistTrigger.textContent = problems.join(", ");
      if (checklistDetailEl.value.trim() === "ปกติ") checklistDetailEl.value = "";
    }
  }
  checklistBoxes.forEach(function (box) {
    box.addEventListener("change", function () {
      if (box === noIssueBox) {
        if (box.checked) checklistBoxes.forEach(function (b) { if (b !== noIssueBox) b.checked = false; });
      } else if (box.checked) {
        noIssueBox.checked = false;
      }
      if (selectedProblems().length === 0) noIssueBox.checked = true;
      updateChecklistSummary();
    });
  });

  // ---- cache: last used ทะเบียนรถ + รหัสพนักงาน ----
  function loadCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return;
      var c = JSON.parse(raw);
      if (c.plate) plateEl.value = c.plate;
      if (c.empCode) empCodeEl.value = c.empCode;
    } catch (e) { /* ignore corrupt cache */ }
  }
  function saveCache(plate, empCode) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ plate: plate, empCode: empCode }));
    } catch (e) { /* storage unavailable, ignore */ }
  }
  loadCache();

  function validate() {
    if (!plateEl.value) return "กรุณาเลือกทะเบียนรถ";
    var mileage = mileageEl.value.trim();
    if (!mileage || isNaN(mileage) || parseInt(mileage, 10) < 0) return "กรุณากรอกเลขไมล์ให้ถูกต้อง";
    if (!empCodeEl.value.trim()) return "กรุณากรอกรหัสพนักงาน";
    if (!checklistDetailEl.value.trim()) return "กรุณากรอกรายละเอียดข้อบกพร่อง (หากไม่พบปัญหา ระบุว่า \"ปกติ\")";
    return null;
  }

  $("view-form").addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.textContent = "";

    var err = validate();
    if (err) { errorMsg.textContent = err; return; }

    var plate = plateEl.value;
    var mileage = parseInt(mileageEl.value, 10);
    var empCode = empCodeEl.value.trim();
    var lastOil = computeLastOil(mileage);

    var problems = selectedProblems();
    var checklistValues = problems.length ? problems : [NO_ISSUE];

    var params = new URLSearchParams();
    params.set("usp", "pp_url");
    params.set("entry." + ENTRY.BRANCH, FIXED.branch);
    params.set("entry." + ENTRY.DEPT, FIXED.dept);
    params.set("entry." + ENTRY.PLATE, plate);
    params.set("entry." + ENTRY.LAST_OIL, String(lastOil));
    params.set("entry." + ENTRY.MILEAGE, String(mileage));
    params.set("entry." + ENTRY.VEHICLE_TYPE, FIXED.vehicleType);
    checklistValues.forEach(function (v) { params.append("entry." + ENTRY.CHECKLIST, v); });
    params.set("entry." + ENTRY.CHECKLIST_DETAIL, checklistDetailEl.value.trim());
    params.set("entry." + ENTRY.EMP_CODE, empCode);

    saveCache(plate, empCode);
    setState("loading");
    window.location.href = FORM_VIEW_URL + "?" + params.toString();
  });

})();
</script>
</body>
</html>
